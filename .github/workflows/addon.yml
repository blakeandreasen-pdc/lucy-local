name: Home Assistant add-on image

on:
  push:
    branches: [main]
    paths: ["lucy_local/**", "pyproject.toml", "docker/mediamtx/**", "ha-addon/**", ".github/workflows/addon.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {platform: linux/amd64, arch: amd64}
          - {platform: linux/arm64, arch: aarch64}
    steps:
      - uses: actions/checkout@v4
      - name: Version from the add-on config
        id: v
        run: |
          v=$(sed -nE 's/^version: *"?([^"]+)"?$/\1/p' ha-addon/config.yaml)
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ha-addon/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/lucy-local-addon-${{ matrix.arch }}:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/lucy-local-addon-${{ matrix.arch }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            io.hass.version=${{ steps.v.outputs.version }}
            io.hass.arch=${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
