[project]
name = "lucy-local"
version = "0.1.0"
description = "Local cloud and control panel for Trifo robot vacuums (Max, Lucy) after the Trifo cloud shut down"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.32.1",
  "pydantic==2.10.4",
  "aiomqtt==2.3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lucy_local"]

[tool.setuptools.package-data]
lucy_local = ["web/*"]
