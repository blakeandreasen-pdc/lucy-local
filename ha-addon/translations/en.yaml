configuration:
  server_ip:
    name: Server IP
    description: >-
      This Home Assistant host's LAN address, e.g. 192.168.1.50. The robot is sent here, and
      your DNS must point *.trifo.com and *.lightfieldcamera.com.cn at it (see Documentation).
  log_level:
    name: Log level
    description: debug shows every message to and from the robot.
  capture:
    name: Capture robot frames
    description: Debugging only. Logs every robot frame to /data/capture.jsonl (grows ~14 MB/h with the map open).
network:
  443/tcp: "Robot update checks (optional; clear if 443 is taken)"
  7990/tcp: "Robot dispatch (required)"
  17766/tcp: "Robot MQTT (required)"
  1935/tcp: "Robot camera stream in"
  8080/tcp: "Web UI and API (the integration uses this)"
  8889/tcp: "Camera in the browser (WebRTC)"
  8189/udp: "Camera in the browser (WebRTC media)"
  8554/tcp: "Camera over RTSP (integration)"
  8888/tcp: "Camera over HLS (optional)"
