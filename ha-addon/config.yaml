name: Lucy Local
version: "0.1.7"
slug: lucy_local
description: Local cloud for Trifo robot vacuums (Max, Lucy), with camera, map and control panel
url: https://github.com/blakeandreasen-pdc/lucy-local
arch:
  - amd64
  - aarch64
# prebuilt by .github/workflows/addon.yml
image: ghcr.io/blakeandreasen-pdc/lucy-local-addon-{arch}
startup: services
boot: auto
init: false
# the web UI inside Home Assistant (sidebar), proxied by the Supervisor; also on 8110 for the integration
ingress: true
ingress_port: 8080
panel_icon: mdi:robot-vacuum
panel_title: Robot vacuum
watchdog: "http://[HOST]:[PORT:8080]/health"
ports:
  443/tcp: 443
  7990/tcp: 7990
  17766/tcp: 17766
  1935/tcp: 1935
  8080/tcp: 8110
  8889/tcp: 8889
  8189/udp: 8189
  8554/tcp: 8554
  8888/tcp: null
options:
  server_ip: ""
  log_level: info
  capture: false
schema:
  server_ip: str
  log_level: list(debug|info|warning|error)
  capture: bool
